function tone(freq,duration=.25,gain=.28){if(!$('sound').checked)return;try{const c=audio(),o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(freq,c.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*.5),c.currentTime+duration);g.gain.setValueAtTime(gain,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+duration);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+duration)}catch(e){console.warn(e)}}

function normalized(model){const box=new THREE.Box3().setFromObject(model),sz=new THREE.Vector3(),mid=new THREE.Vector3();box.getSize(sz);box.getCenter(mid);const g=new THREE.Group();g.add(model);const factor=1/Math.max(sz.x,sz.y,sz.z,.001);model.scale.multiplyScalar(factor);model.position.copy(mid).multiplyScalar(-factor);return g}

function dropObjects(){token++;for(const g of Object.values(objs))scene.remove(g);objs={};baseline={};offsets={actor:[0,0,1,0],machine:[0,0,1,0],chuck:[0,0,1,0]};state='idle';time=0;impactPlayed=false;forkliftSafeT=0;stage.classList.remove('shake');$('flash').style.opacity=0;$('veil').style.opacity=0;if('speechSynthesis'in window)speechSynthesis.cancel()}

async function select(i){dropObjects();index=i;const t=token,d=defs[i];$('photo').src=bg+d.file;$('title').textContent=d.title;$('loading').textContent='GLB 로딩 중';step('사고 전 현장');msg('모델을 불러오고 있습니다.');$('choices').innerHTML='';d.question.forEach((q,k)=>{const b=document.createElement('button');b.textContent=(k?'안전 행동: ':'위험 행동: ')+q;b.onclick=()=>{if(k){halt();msg('올바른 선택입니다. '+d.rule);speak(d.rule)}else{msg('위험한 행동입니다. 사고 시뮬레이션을 실행해 보세요.');start()}};$('choices').append(b)});[...$('menu').children].forEach((b,j)=>b.classList.toggle('active',i===j));$('object').value='actor';syncSliders();const jobs=[loadModel('construction_worker.glb').then(m=>{if(token===t)attach('actor',m,d.actor)}).catch(e=>{console.error(e);if(token===t){attach('actor',fallbackWorker(),d.actor);msg('작업자 GLB 로딩 실패: '+e.message)}})];
 const files={lathe:'lathe.glb',forklift:'forklift.glb',electric:'electrical-box.glb',tank:'storage-tanks.glb'};if(files[d.type])jobs.push(loadModel(files[d.type]).then(m=>{if(token===t)attach('machine',m,d.machine)}).catch(e=>{console.error(e);if(token===t)msg('설비 GLB 로딩 실패: '+e.message)}));if(d.type==='lathe')jobs.push(loadModel('lathe_chuck.glb').then(m=>{if(token===t)attach('chuck',m,d.chuck)}).catch(e=>{console.error(e);if(token===t)msg('선반 척 GLB 로딩 실패: '+e.message)}));await Promise.allSettled(jobs);if(token===t){const needed=['actor',...(d.machine?['machine']:[]),...(d.chuck?['chuck']:[])];const missing=needed.filter(k=>!objs[k]);$('loading').textContent=missing.length?'일부 모델 누락: '+missing.join(', '):'GLB 준비 완료';if(!missing.length)msg('모델 준비 완료. 작업자를 선택하고 슬라이더를 움직여 보세요. 사고 재현 중에는 조정 시 재현이 정지됩니다.');syncSliders()}}

function collisionSound(){
 if(!$('sound').checked)return;
 try{const c=audio(),duration=.8,buffer=c.createBuffer(1,Math.ceil(c.sampleRate*duration),c.sampleRate),samples=buffer.getChannelData(0);
 for(let i=0;i<samples.length;i++){const t=i/c.sampleRate;samples[i]=(Math.random()*2-1)*Math.exp(-t*8);}

// 지게차 후진: 원근감이 드러나도록 GLB 자체 배율을 확대한다.
// 실제 GLB의 투영 외곽선이 작업자와 처음 접촉하는 프레임에서 멈춘다.
const forkliftEnd=[43,88,10.2,265];
function forkliftPose(t){
 const b=baseline.machine;
 // 후진 거리 증가에 따라 화면에서 크기가 확실히 커지는 비선형 보간
 const scaleT=Math.pow(t,1.12);

}
function projectedRect(obj){
 obj.updateWorldMatrix(true,true);
 const b=new THREE.Box3().setFromObject(obj);
 if(b.isEmpty())return null;
 const corners=[];
 for(const x of [b.min.x,b.max.x])for(const y of [b.min.y,b.max.y])for(const z of [b.min.z,b.max.z]){
  const v=new THREE.Vector3(x,y,z).project(cam);
  corners.push(v);
 }
 return {left:Math.min(...corners.map(v=>v.x)),right:Math.max(...corners.map(v=>v.x)),top:Math.max(...corners.map(v=>v.y)),bottom:Math.min(...corners.map(v=>v.y))};
}
function touchesWorker(){
 if(!objs.machine||!objs.actor)return false;
 const f=projectedRect(objs.machine),w=projectedRect(objs.actor);
 if(!f||!w)return false;
 // 화면 전체 외곽선이 아닌, 지게차의 후면 하단과 작업자 몸통으로 접촉 판정.
 // 정규화 투영 좌표: 위쪽이 +1, 아래쪽이 -1.
 const workerCenterX=(w.left+w.right)/2;
 const workerTorsoY=w.top-(w.top-w.bottom)*0.55;
 const forkliftRearY=f.bottom+(f.top-f.bottom)*0.12;
 const forkliftCenterX=(f.left+f.right)/2;
 const horizontalTolerance=Math.max((w.right-w.left)*0.42,0.035);

}
function moveForkliftSafely(targetT){
 if(!objs.machine||!objs.actor)return false;
 // 사용자 조정으로 처음부터 겹친 경우, 즉시 사고로 판정

 if(!touchesWorker()){forkliftSafeT=targetT;return false;}
 let lo=forkliftSafeT,hi=targetT;
 for(let i=0;i<15;i++){
  const mid=(lo+hi)/2;
  forkliftPose(mid);
  if(touchesWorker())hi=mid;else lo=mid;

}

function animation(now){requestAnimationFrame(animation);const dt=Math.min(.06,(now-last)/1000);last=now;const d=defs[index],a=objs.actor,m=objs.machine,c=objs.chuck;if(state==='run'){time+=dt;const t=Math.min(time/(index===2?6:4),1);if(index===0){moveFallActor(t)}if(index===1){interpolate(a,baseline.actor,[49,70,4.0,180],t,'actor');if(c)c.rotation.z+=dt*12}if(index===2){if(m&&moveForkliftSafely(t)){impact();}}if(index===3){interpolate(a,baseline.actor,[29,75,4.0,180],t,'actor')}if(index===4){interpolate(a,baseline.actor,[54,58,4.0,180],t,'actor')}if(time>=4&&state==='run'&&index!==2)impact();if(index===2&&time>=6&&state==='run'){state='idle';msg('지게차가 작업자에게 닿지 않았습니다. 설비 위치를 조정한 뒤 다시 실행하세요.');step('충돌 미발생 — 배치 확인 필요');}}
else if(state==='impact'){time+=dt;const t=Math.min(time/1.9,1);if(index===0&&a){fallIntoHole(t)}if(index===1&&a){interpolate(a,[49,70,4.0,180],[44,70,4.0,215],Math.min(t,1),'actor');if(c)c.rotation.z+=dt*15}if(index===2&&m){/* 충돌 시점의 크기와 위치 고정, 작업자 관통 금지 */if(a&&t>.05){a.rotation.z=-Math.min((t-.05)*.24,.18)}}if(index===3){$('flash').style.opacity=(1-t)*.9;if(a)a.rotation.z=Math.sin(t*20)*.12}if(index===4){$('veil').style.opacity=t*.9;if(a)interpolate(a,[54,58,4.0,180],[54,62,3.6,180],t,'actor')}if(time>1.9){state='done';stage.classList.remove('shake');$('flash').style.opacity=0;step('사고 원인과 예방조치를 확인하세요')}}
renderer.render(scene,cam)}
function resize(){const r=stage.getBoundingClientRect(),aspect=r.width/r.height;renderer.setSize(r.width,r.height,false);cam.top=4.5;cam.bottom=-4.5;cam.left=-4.5*aspect;cam.right=4.5*aspect;cam.updateProjectionMatrix();apply()}
for(let i=0;i<defs.length;i++){const b=document.createElement('button');b.textContent=defs[i].title;b.onclick=()=>select(i);$('menu').append(b)}
$('object').onchange=syncSliders;for(const id of ['x','y','size','rot'])$(id).oninput=()=>{const k=$('object').value;offsets[k]=[Number($('x').value),Number($('y').value),Number($('size').value)/100,Number($('rot').value)];if(state!=='idle'){halt();msg('조정값을 적용했습니다. 사고 재현을 다시 시작하세요.')}apply();showValues()};$('resetObject').onclick=()=>{halt();offsets[$('object').value]=[0,0,1,0];syncSliders();apply()};$('save').onclick=()=>{const text=JSON.stringify({scene:defs[index].type,offsets},null,2);navigator.clipboard?.writeText(text).then(()=>msg('현재 배치값을 복사했습니다.')).catch(()=>msg(text))};$('start').onclick=start;$('reset').onclick=()=>select(index);$('safety').onclick=()=>{halt();msg('예방조치: '+defs[index].rule);speak(defs[index].rule)};$('stop').onclick=()=>{halt();msg('긴급 정지되었습니다.');tone(180,.6,.32)};$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen?.();$('photo').onerror=()=>{$('loading').textContent='배경 이미지 누락';msg('파일 확인: '+bg+defs[index].file)};window.addEventListener('resize',resize);document.addEventListener('fullscreenchange',resize);resize();requestAnimationFrame(animation);select(0);
</script></body></html>
