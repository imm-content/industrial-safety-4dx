let index=0,token=0,objs={},cache=new Map(),state='idle',time=0,last=performance.now(),ctx=null,baseline={},offsets={},impactPlayed=false, collapseFoot=null, collapseStart=null;
const audio=()=>{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();return ctx};

function place(group,loc){const w=cam.right-cam.left,h=cam.top-cam.bottom;group.position.set((loc[0]/100-.5)*w,(.5-loc[1]/100)*h,0);group.rotation.set(0,THREE.MathUtils.degToRad(loc[3]),0);group.scale.setScalar(loc[2]);}

function fallbackWorker(){const g=new THREE.Group();const m=c=>new THREE.MeshStandardMaterial({color:c});const p=(x,y,z,w,h,d,c)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m(c));o.position.set(x,y,z);g.add(o)};p(0,.1,0,.3,.45,.2,0xff8425);p(0,.42,0,.22,.24,.2,0xe8c7a7);p(0,.6,0,.32,.12,.3,0xe9edf1);for(const s of [-1,1]){p(s*.24,.05,0,.12,.42,.14,0x235d87);p(s*.1,-.38,0,.13,.45,.14,0x8d806f)}return g}

async function select(i){dropObjects();index=i;const t=token,d=defs[i];$('forkliftTag').style.display=d.type==='forklift'?'block':'none';$('photo').src=bg+d.file;$('title').textContent=d.title;$('loading').textContent='GLB 로딩 중';step('사고 전 현장');msg('모델을 불러오고 있습니다.');$('choices').innerHTML='';d.question.forEach((q,k)=>{const b=document.createElement('button');b.textContent=(k?'안전 행동: ':'위험 행동: ')+q;b.onclick=()=>{if(k){halt();msg('올바른 선택입니다. '+d.rule);speak(d.rule)}else{msg('위험한 행동입니다. 사고 시뮬레이션을 실행해 보세요.');start()}};$('choices').append(b)});[...$('menu').children].forEach((b,j)=>b.classList.toggle('active',i===j));$('object').value='actor';syncSliders();const jobs=[loadModel('construction_worker.glb').then(m=>{if(token===t)attach('actor',m,d.actor)}).catch(e=>{console.error(e);if(token===t){attach('actor',fallbackWorker(),d.actor);msg('작업자 GLB 로딩 실패: '+e.message)}})];

// 빨간 선은 사용자가 스크린샷에 그린 참고 표시이며 HTML 화면에 별도 선을 그리지 않는다.
const forkliftStop={x:49.5,y:81.0,scale:6.1};
function forkliftPose(t){

 const startScale=b[2]*v[2],endScale=forkliftStop.scale*v[2];
 // 지게차의 하단이 지정된 정지선(y=81%)에 닿는 위치를 실제 GLB 경계로 산출한다.
 // 초기 배치에서 목표 배치로 부드럽게 보간한다.

 if(!g)return;

function projectedRect(obj){

 const pts=[];
 for(const x of [box.min.x,box.max.x])for(const y of [box.min.y,box.max.y])for(const z of [box.min.z,box.max.z])pts.push(new THREE.Vector3(x,y,z).project(cam));
 return {left:Math.min(...pts.map(p=>p.x)),right:Math.max(...pts.map(p=>p.x)),top:Math.max(...pts.map(p=>p.y)),bottom:Math.min(...pts.map(p=>p.y))};
}
// 넘어지는 동안 작업자의 발을 기준점으로 고정해 몸이 바닥으로 쓰러지도록 연출한다.
function prepareCollapse(){
 const a=objs.actor;if(!a)return;
 a.rotation.z=0;
 const r=projectedRect(a);if(!r)return;
 const b=baseline.actor,v=offsets.actor||[0,0,1,0];
 collapseFoot={x:(r.left+r.right+2)*25,y:(1-r.bottom)*50};
 collapseStart={x:(a.position.x/(cam.right-cam.left)+.5)*100,
                y:(.5-a.position.y/(cam.top-cam.bottom))*100,
                scale:a.scale.x, yaw:THREE.MathUtils.radToDeg(a.rotation.y)};
}
function collapseWorker(t,direction=1){
 const a=objs.actor;if(!a)return;
 if(!collapseFoot)prepareCollapse();
 if(!collapseFoot)return;
 const p=Math.max(0,Math.min(1,t)),ease=p*p*(3-2*p);
 // GLB의 중심에서 회전시키되, 매 프레임 발의 바닥 접점을 재정렬한다.
 place(a,[collapseStart.x,collapseStart.y,collapseStart.scale,collapseStart.yaw]);
 a.rotation.z=direction*ease*Math.PI*.47;
 const r=projectedRect(a);if(!r)return;
 const currentFootX=(r.left+r.right+2)*25;
 const currentFootY=(1-r.bottom)*50;
 const w=cam.right-cam.left,h=cam.top-cam.bottom;
 a.position.x+=(collapseFoot.x-currentFootX)*w/100;
 a.position.y-=(collapseFoot.y-currentFootY)*h/100;
}
function animation(now){
 requestAnimationFrame(animation);
 const dt=Math.min(.06,(now-last)/1000);last=now;
 const d=defs[index],a=objs.actor,m=objs.machine;
 if(state==='run'){
   time+=dt;
   const duration=d.type==='forklift'?6:4;
   const t=Math.min(time/duration,1);
   if(d.type==='fall')moveFallActor(t);
   if(d.type==='forklift'&&m)forkliftPose(t);
   if(d.type==='electric'&&a){
     // 먼저 첨부 2와 같은 왼쪽 측면(116°)으로 방향을 바꾼다.
     // 회전이 끝날 때까지 작업자 위치는 고정하고, 그 후 전기설비 쪽으로 이동한다.
     const turn=Math.min(1,t/.20);
     const turnEase=turn*turn*(3-2*turn);
     const walk=Math.max(0,Math.min(1,(t-.20)/.80));
     const walkEase=walk*walk*(3-2*walk);
     const v=offsets.actor||[0,0,1,0],b=baseline.actor;
     const facing=b[3]+(d.contact[3]-b[3])*turnEase;
     place(a,[b[0]+(d.contact[0]-b[0])*walkEase+v[0],
              b[1]+(d.contact[1]-b[1])*walkEase+v[1],
              b[2]*v[2],facing+v[3]]);
   }
   if(t>=1&&state==='run'){
     if(d.type==='forklift'&&!m){msg('지게차 GLB를 불러오지 못했습니다.');halt();}
     else {if(d.type==='electric'&&a){
       const v=offsets.actor||[0,0,1,0];
       place(a,[d.contact[0]+v[0],d.contact[1]+v[1],d.contact[2]*v[2],d.contact[3]+v[3]]);
     }
     collapseFoot=null;collapseStart=null;impact();}
   }
 }else if(state==='impact'){
   time+=dt;const t=Math.min(time/1.9,1);
   if(d.type==='fall'&&a)fallIntoHole(t);
   if(d.type==='forklift'&&a){if(t>.07)collapseWorker((t-.07)/.93,-1);}
   if(d.type==='electric'){
     $('flash').style.opacity=(1-t)*.85;
     if(a){if(t<.22){a.rotation.z=Math.sin(t*75)*.075;}
           else{if(!collapseFoot){a.rotation.z=0;prepareCollapse();}
                collapseWorker((t-.22)/.78,-1);}}
   }
   if(time>1.9){state='done';stage.classList.remove('shake');$('flash').style.opacity=0;step('사고 원인과 예방조치를 확인하세요');}
 }
 // 지게차의 화면상 위치를 기준으로 안내 문구를 함께 이동시킨다.
 const tag=$('forkliftTag');
 if(d.type==='forklift'&&m&&m.visible){
   const r=projectedRect(m);
   if(r){const px=Math.min(91,Math.max(9,(r.right+1)*50+9));
     const py=Math.min(92,Math.max(9,(1-r.top)*50+4));
     tag.style.left=px+'%';tag.style.top=py+'%';tag.style.display='block';}
 }else tag.style.display='none';
 renderer.render(scene,cam);
}
function resize(){const r=stage.getBoundingClientRect(),aspect=r.width/r.height;renderer.setSize(r.width,r.height,false);cam.top=4.5;cam.bottom=-4.5;cam.left=-4.5*aspect;cam.right=4.5*aspect;cam.updateProjectionMatrix();apply();if(index===0&&state==='idle'){fallFootStart=null;fallCenterAtHole=null;}}
for(let i=0;i<defs.length;i++){const b=document.createElement('button');b.textContent=defs[i].title;b.onclick=()=>select(i);$('menu').append(b)}
$('object').onchange=syncSliders;for(const id of ['x','y','size','rot'])$(id).oninput=()=>{const k=$('object').value;offsets[k]=[Number($('x').value),Number($('y').value),Number($('size').value)/100,Number($('rot').value)];if(state!=='idle'){halt();msg('조정값을 적용했습니다. 사고 재현을 다시 시작하세요.')}apply();showValues()};$('resetObject').onclick=()=>{halt();offsets[$('object').value]=[0,0,1,0];syncSliders();apply()};$('save').onclick=()=>{const text=JSON.stringify({scene:defs[index].type,offsets},null,2);navigator.clipboard?.writeText(text).then(()=>msg('현재 배치값을 복사했습니다.')).catch(()=>msg(text))};$('start').onclick=start;$('reset').onclick=()=>select(index);$('safety').onclick=()=>{halt();msg('예방조치: '+defs[index].rule);speak(defs[index].rule)};$('stop').onclick=()=>{halt();msg('긴급 정지되었습니다.');tone(180,.6,.32)};$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen?.();$('photo').onerror=()=>{$('loading').textContent='배경 이미지 누락';msg('파일 확인: '+bg+defs[index].file)};window.addEventListener('resize',resize);document.addEventListener('fullscreenchange',resize);resize();requestAnimationFrame(animation);select(0);
</script></body></html>
